# C++2B (C++23 draft) & Hardware QDEC for NCS v2.8.0 (Zephyr v3.7.99)
CONFIG_STD_CPP2B=y
CONFIG_SENSOR=y
CONFIG_QDEC_NRFX=y

# Clock Source: Internal RC oscillator for Nice!Nano clone compatibility
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

# UF2 Bootloader Flash Partition (0x26000) & Output
CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_BUILD_OUTPUT_UF2=y

# Legacy USB CDC ACM Stack (NCS v2.8.0)
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="Cam Remote Pro"
CONFIG_USB_DEVICE_MANUFACTURER="CamRemote"
CONFIG_USB_DEVICE_VID=0x239A
CONFIG_USB_DEVICE_PID=0x00B3
