# Increased stack due to settings API usage
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

CONFIG_BT=y
CONFIG_LOG=y

CONFIG_BT_DEVICE_APPEARANCE=961
CONFIG_BT_DEVICE_NAME="Cam Remote Pro"

CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DIS=y
CONFIG_BT_DIS_PNP=y
CONFIG_BT_DIS_PNP_VID_SRC=2
CONFIG_BT_DIS_PNP_VID=0x05AC
CONFIG_BT_DIS_PNP_PID=0x0220
CONFIG_BT_DIS_PNP_VER=0x0100
CONFIG_BT_BAS=y

# Enable SMP for HID security (Just Works pairing)
CONFIG_BT_SMP=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_ID_MAX=3

CONFIG_SETTINGS=y
CONFIG_BT_MAX_PAIRED=5
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

# BT_SETTINGS requires a flash backend
CONFIG_SETTINGS_NVS=y

CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_ADC=y


# Modern C++20 Support
CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_EXTERNAL_LIBCPP=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# Just Works pairing only provides BT_SECURITY_L2 (encryption without MITM).
# Disable authenticated permissions so HID attributes only require encryption.
# Windows requires authenticated (MITM) security for BLE HID devices.
# Uses passkey display for pairing (shown on serial console).
CONFIG_SAMPLE_BT_USE_AUTHENTICATION=y

# Rotary Encoder Support via Hardware QDEC
CONFIG_SENSOR=y

# USB CDC ACM for Debugging (Modern Stack)
CONFIG_USB_DEVICE_STACK=n
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_UART_LINE_CTRL=y
