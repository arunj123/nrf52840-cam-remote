# Increased stack due to settings API usage
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

CONFIG_BT=y
CONFIG_LOG=y
CONFIG_BT_MAX_CONN=4
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_GATT_CACHING=y
CONFIG_BT_GATT_SERVICE_CHANGED=y

CONFIG_BT_DEVICE_APPEARANCE=961
CONFIG_BT_DEVICE_NAME="Cam Remote Pro 1"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=24

CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DIS=y
CONFIG_BT_DIS_PNP=y
CONFIG_BT_DIS_PNP_VID_SRC=2
CONFIG_BT_DIS_PNP_VID=0x05AC
CONFIG_BT_DIS_PNP_PID=0x0220
CONFIG_BT_DIS_PNP_VER=0x0100
CONFIG_BT_BAS=y

# Enable SMP for HID security (Just Works pairing)
CONFIG_BT_SMP=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_ID_MAX=4

CONFIG_SETTINGS=y
CONFIG_BT_MAX_PAIRED=5
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

# BT_SETTINGS requires a flash backend
CONFIG_SETTINGS_NVS=y

CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_ADC=y


# Modern C++ Support (Standard and USB stack configured per-board in boards/*.conf)
CONFIG_CPP=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n
CONFIG_CBPRINTF_FP_SUPPORT=y

# Just Works pairing (BT_SECURITY_L2) without MITM authentication by default.
# Set CONFIG_SAMPLE_BT_USE_AUTHENTICATION=y if passkey display pairing is required.
CONFIG_SAMPLE_BT_USE_AUTHENTICATION=n
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y

# Rotary Encoder Support via Hardware QDEC
CONFIG_SENSOR=y

# Serial / Console / Logging over USB CDC ACM
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_UART_LINE_CTRL=y
